<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>纸房子：放学后的对决</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
<main class="game-shell">
  <section class="game" id="game" aria-label="赵颖与钟雅静的格斗游戏">
    <picture><source media="(max-width:760px), (pointer:coarse)" srcset="assets/arena-mobile.webp" type="image/webp"><source srcset="assets/arena.webp" type="image/webp"><img class="arena-bg" src="assets/arena.png" alt="操场"></picture>
    <div class="arena-tone"></div><div class="speed-lines"></div>
    <header class="hud">
      <div class="player-hud">
        <div class="name-line"><span>赵颖</span><span class="tag">PLAYER</span></div>
        <div class="bar-frame"><div class="health" id="pHealth"></div></div>
        <div class="energy-frame"><div class="energy" id="pEnergy"></div></div>
      </div>
      <div><div class="timer" id="timer">60</div><div class="round-label">ROUND 1</div></div>
      <div class="player-hud right">
        <div class="name-line"><span>钟雅静</span><span class="tag">CPU</span></div>
        <div class="bar-frame"><div class="health" id="cHealth"></div></div>
        <div class="energy-frame"><div class="energy" id="cEnergy"></div></div>
      </div>
    </header>
    <div class="stage" id="stage">
      <div class="floor"></div>
      <div class="fighter face-right" id="player"><div class="fighter-card"><img class="portrait" alt="赵颖"></div><div class="shadow"></div></div>
      <div class="fighter cpu face-left" id="cpu"><div class="fighter-card"><img class="portrait" alt="钟雅静"></div><div class="shadow"></div></div>
    </div>
    <div class="announcer" id="announcer"></div>
    <div class="combat-toast" id="combatToast"></div>
    <div class="ultimate-cut-in hidden" id="ultimateCutIn" aria-hidden="true">
      <div class="ult-slash"></div><img class="ult-main" id="ultMain" alt=""><img class="ult-helper" id="ultHelper" alt=""><div class="ult-title" id="ultTitle"></div>
    </div>
    <div class="controls-help"><span class="key">A / D 移动</span><span class="key">J 三连 / 反击</span><span class="key">K 援助</span><span class="key">L 格挡</span></div>
    <button class="sound" id="sound" aria-label="切换声音">♪</button>
    <div class="mobile-controls">
      <div class="mobile-group"><button class="touch-btn" data-key="a">◀</button><button class="touch-btn" data-key="d">▶</button><button class="touch-btn" data-key="l">挡</button></div>
      <div class="mobile-group"><button class="touch-btn attack" data-key="j">打</button><button class="touch-btn special-btn" data-key="k">援助</button></div>
    </div>
    <div class="overlay" id="startOverlay">
      <div class="panel"><div class="eyebrow">PAPER HOUSE · MINI FIGHTER</div><h1>放学后的对决</h1><p class="subtitle">赵颖 VS 钟雅静<br>连续按 J 打出三连；格挡成功后按 J 反击。能量满 40 可呼叫专属援助。</p><p class="load-status" id="loadStatus" role="status">正在准备战斗素材…</p><button class="start-btn" id="startBtn" disabled>素材加载中</button></div>
    </div>
    <div class="overlay hidden" id="endOverlay">
      <div class="panel"><div class="eyebrow">RESULT</div><h1 id="resultTitle">赵颖获胜</h1><p class="result" id="resultText"></p><button class="start-btn" id="restartBtn">再来一局</button></div>
    </div>
  </section>
</main>
<script src="js/game.js" defer></script>
</body>
</html>
